<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - Mr.Huy Bình & Ly Giữ Nhiệt</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Base CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-nav-header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 24px;
        }

        .header-wrap {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px;
        }

        .auth-container {
            max-width: 460px;
            margin: 40px auto 60px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .auth-card-head {
            padding: 24px;
            text-align: center;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
        }

        .auth-tab-btn {
            flex: 1;
            padding: 14px;
            background: #f8fafc;
            border: none;
            font-weight: 700;
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-tab-btn.active {
            background: #ffffff;
            color: #0284c7;
            border-bottom: 2px solid #0284c7;
        }

        .auth-card-body {
            padding: 24px;
        }

        .form-group-login {
            margin-bottom: 16px;
        }

        .label-login {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-login {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-login:focus {
            border-color: #0284c7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-submit-login {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit-login:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <header class="login-nav-header">
        <div class="header-wrap">
            <a href="index.html" class="brand-box">
                <img src="img/logo.png" alt="Mr.Huy Logo" class="brand-logo-img">
                <div>
                    <div style="font-size: 18px; font-weight: 800; color: #0284c7;">Mr.Huy</div>
                    <div style="font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase;">Xưởng Bình & Ly Giữ Nhiệt Cao Cấp</div>
                </div>
            </a>
            <a href="index.html" style="font-size: 13px; color: #64748b; text-decoration: none; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại Cửa hàng
            </a>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-card-head">
                <img src="img/logo.png" alt="Mr.Huy Logo" style="width: 56px; height: 56px; border-radius: 10px; margin: 0 auto 10px auto; display: block; object-fit: cover;">
                <h2 style="font-size: 18px; font-weight: 800; color: #0f172a; margin: 0;">Tài Khoản Khách Hàng</h2>
                <div style="font-size: 12px; color: #64748b; margin-top: 4px;">Chào mừng bạn đến với Mr.Huy Thermos</div>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">
                    Đăng Nhập
                </button>
                <button type="button" class="auth-tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">
                    Đăng Ký Mới
                </button>
            </div>

            <div class="auth-card-body">
                <!-- FORM ĐĂNG NHẬP -->
                <form id="formLogin" onsubmit="handleAuthLogin(event)">
                    <div class="form-group-login">
                        <label class="label-login">Tên đăng nhập hoặc Email:</label>
                        <input type="text" id="logUser" class="input-login" value="nguyenvana" required>
                    </div>
                    <div class="form-group-login">
                        <label class="label-login">Mật khẩu:</label>
                        <input type="password" id="logPass" class="input-login" value="123456" required>
                    </div>
                    <button type="submit" class="btn-submit-login">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i> ĐĂNG NHẬP
                    </button>
                </form>

                <!-- FORM ĐĂNG KÝ -->
                <form id="formRegister" onsubmit="handleAuthRegister(event)" style="display: none;">
                    <div class="form-group-login">
                        <label class="label-login">Họ và tên của bạn:</label>
                        <input type="text" id="regName" class="input-login" placeholder="Ví dụ: Trần Thị Bình" required>
                    </div>
                    <div class="form-group-login">
                        <label class="label-login">Tên đăng nhập:</label>
                        <input type="text" id="regUser" class="input-login" placeholder="Ví dụ: tranthib" required>
                    </div>
                    <div class="form-group-login">
                        <label class="label-login">Số điện thoại:</label>
                        <input type="tel" id="regPhone" class="input-login" placeholder="Ví dụ: 0987654321" required>
                    </div>
                    <div class="form-group-login">
                        <label class="label-login">Mật khẩu:</label>
                        <input type="password" id="regPass" class="input-login" placeholder="Mật khẩu..." required>
                    </div>
                    <button type="submit" class="btn-submit-login" style="background: #166534;">
                        <i class="fa-solid fa-user-plus"></i> HOÀN TẤT ĐĂNG KÝ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(mode) {
            const tabLog = document.getElementById('tabLoginBtn');
            const tabReg = document.getElementById('tabRegisterBtn');
            const formLog = document.getElementById('formLogin');
            const formReg = document.getElementById('formRegister');

            if (mode === 'register') {
                tabLog.classList.remove('active');
                tabReg.classList.add('active');
                formLog.style.display = 'none';
                formReg.style.display = 'block';
            } else {
                tabReg.classList.remove('active');
                tabLog.classList.add('active');
                formReg.style.display = 'none';
                formLog.style.display = 'block';
            }
        }

        function handleAuthLogin(e) {
            e.preventDefault();
            localStorage.setItem('user_logged_in', 'true');
            window.location.href = 'index.html';
        }

        function handleAuthRegister(e) {
            e.preventDefault();
            localStorage.setItem('user_logged_in', 'true');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('mode') === 'register') {
                switchTab('register');
            }
        });
    </script>
</body>
</html>
